[package]
name = "minilab-core"
version = "0.1.0"
edition = "2021"
description = "Minilab core: business canon, elastic operating config, exploration, and canonical entity types"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
constitutional-runtime = { path = "../constitutional-runtime" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }
